<!doctype html><meta charset="utf-8"><title>Corner whips</title>
<style>body{font:16px system-ui;background:#181b20;color:#eee;margin:24px;max-width:1100px}select,button{font:inherit;padding:6px;margin-right:12px}canvas{width:100%;background:#000}#stats{padding:12px 0;color:#ccc}</style>
<h1>Corner whips and rope rebound</h1><p>Candidate only: <code>?grapples=v1</code>. In a lockup hold up or down plus left or right and press grapple. Rope = left or right alone. Normal speed (30 fps strip).</p>
<label>Attacker <select id="pair"><option value="lou-george">Lou</option><option value="george-lou">George</option></select></label>
<label>Starting facing <select id="facing"><option value="1">Right</option><option value="-1">Left</option></select></label>
<label>Whip <select id="dirKey"><option value="left">Left</option><option value="right">Right</option></select></label>
<label>To <select id="vert"><option value="up">Far corner</option><option value="down">Near corner</option><option value="rope">Rope + rebound</option></select></label>
<button id="pause">Pause</button><button id="speed">Slow</button><p id="stats"></p><canvas id="film"></canvas>
<script>
const runs=[{"id":"lou-george-1-left-up","pair":"lou-george","facing":1,"dirKey":"left","vert":"up","hitX":224.5,"hitY":264,"wantY":264,"arrivedMs":1317,"state":"staggered","frames":79},{"id":"lou-george-1-left-down","pair":"lou-george","facing":1,"dirKey":"left","vert":"down","hitX":65.5,"hitY":439,"wantY":439,"arrivedMs":1450,"state":"staggered","frames":79},{"id":"lou-george-1-left-rope","pair":"lou-george","facing":1,"dirKey":"left","vert":"rope","rebound":true,"endMs":3883,"endY":380.2,"frames":79},{"id":"lou-george-1-right-up","pair":"lou-george","facing":1,"dirKey":"right","vert":"up","hitX":735.5,"hitY":264,"wantY":264,"arrivedMs":1267,"state":"staggered","frames":79},{"id":"lou-george-1-right-down","pair":"lou-george","facing":1,"dirKey":"right","vert":"down","hitX":894.5,"hitY":439,"wantY":439,"arrivedMs":1200,"state":"staggered","frames":79},{"id":"lou-george-1-right-rope","pair":"lou-george","facing":1,"dirKey":"right","vert":"rope","rebound":true,"endMs":3617,"endY":380.2,"frames":79},{"id":"lou-george--1-left-up","pair":"lou-george","facing":-1,"dirKey":"left","vert":"up","hitX":224.5,"hitY":264,"wantY":264,"arrivedMs":1267,"state":"staggered","frames":79},{"id":"lou-george--1-left-down","pair":"lou-george","facing":-1,"dirKey":"left","vert":"down","hitX":65.5,"hitY":439,"wantY":439,"arrivedMs":1450,"state":"staggered","frames":79},{"id":"lou-george--1-left-rope","pair":"lou-george","facing":-1,"dirKey":"left","vert":"rope","rebound":true,"endMs":3883,"endY":380.2,"frames":79},{"id":"lou-george--1-right-up","pair":"lou-george","facing":-1,"dirKey":"right","vert":"up","hitX":735.5,"hitY":264,"wantY":264,"arrivedMs":1317,"state":"staggered","frames":79},{"id":"lou-george--1-right-down","pair":"lou-george","facing":-1,"dirKey":"right","vert":"down","hitX":894.5,"hitY":439,"wantY":439,"arrivedMs":1200,"state":"staggered","frames":79},{"id":"lou-george--1-right-rope","pair":"lou-george","facing":-1,"dirKey":"right","vert":"rope","rebound":true,"endMs":3617,"endY":380.2,"frames":79},{"id":"george-lou-1-left-up","pair":"george-lou","facing":1,"dirKey":"left","vert":"up","hitX":224.5,"hitY":264,"wantY":264,"arrivedMs":1317,"state":"staggered","frames":79},{"id":"george-lou-1-left-down","pair":"george-lou","facing":1,"dirKey":"left","vert":"down","hitX":65.5,"hitY":439,"wantY":439,"arrivedMs":1450,"state":"staggered","frames":79},{"id":"george-lou-1-left-rope","pair":"george-lou","facing":1,"dirKey":"left","vert":"rope","rebound":true,"endMs":3883,"endY":380.2,"frames":79},{"id":"george-lou-1-right-up","pair":"george-lou","facing":1,"dirKey":"right","vert":"up","hitX":735.5,"hitY":264,"wantY":264,"arrivedMs":1267,"state":"staggered","frames":79},{"id":"george-lou-1-right-down","pair":"george-lou","facing":1,"dirKey":"right","vert":"down","hitX":894.5,"hitY":439,"wantY":439,"arrivedMs":1200,"state":"staggered","frames":79},{"id":"george-lou-1-right-rope","pair":"george-lou","facing":1,"dirKey":"right","vert":"rope","rebound":true,"endMs":3617,"endY":380.2,"frames":79},{"id":"george-lou--1-left-up","pair":"george-lou","facing":-1,"dirKey":"left","vert":"up","hitX":224.5,"hitY":264,"wantY":264,"arrivedMs":1267,"state":"staggered","frames":79},{"id":"george-lou--1-left-down","pair":"george-lou","facing":-1,"dirKey":"left","vert":"down","hitX":65.5,"hitY":439,"wantY":439,"arrivedMs":1450,"state":"staggered","frames":79},{"id":"george-lou--1-left-rope","pair":"george-lou","facing":-1,"dirKey":"left","vert":"rope","rebound":true,"endMs":3883,"endY":380.2,"frames":79},{"id":"george-lou--1-right-up","pair":"george-lou","facing":-1,"dirKey":"right","vert":"up","hitX":735.5,"hitY":264,"wantY":264,"arrivedMs":1317,"state":"staggered","frames":79},{"id":"george-lou--1-right-down","pair":"george-lou","facing":-1,"dirKey":"right","vert":"down","hitX":894.5,"hitY":439,"wantY":439,"arrivedMs":1200,"state":"staggered","frames":79},{"id":"george-lou--1-right-rope","pair":"george-lou","facing":-1,"dirKey":"right","vert":"rope","rebound":true,"endMs":3617,"endY":380.2,"frames":79}];const canvas=document.getElementById('film'),ctx=canvas.getContext('2d');let frames=[],frame=0,paused=false,slow=false,last=0;
function select(){const r=runs.find(r=>r.pair===pair.value&&r.facing===+facing.value&&r.dirKey===dirKey.value&&r.vert===vert.value);frame=0;frames=Array.from({length:r.frames},(_,i)=>{const im=new Image();im.src='corner-frames/'+r.id+'/s'+String(i).padStart(4,'0')+'.jpg';return im});stats.textContent=r.rebound?'Rope and rebound, ends '+r.endMs+' ms':'Corner hit at '+r.arrivedMs+' ms, at ('+r.hitX+', '+r.hitY+')';}
for(const id of ['pair','facing','dirKey','vert'])document.getElementById(id).onchange=select;
document.getElementById('pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'Play':'Pause'};document.getElementById('speed').onclick=e=>{slow=!slow;e.target.textContent=slow?'Normal speed':'Slow'};
function tick(t){if(t-last>1000/(slow?7.5:30)){last=t;const im=frames[frame];if(im?.complete&&im.naturalWidth){canvas.width=im.naturalWidth;canvas.height=im.naturalHeight;ctx.drawImage(im,0,0);if(!paused)frame=(frame+1)%frames.length;}}requestAnimationFrame(tick)}select();requestAnimationFrame(tick);
