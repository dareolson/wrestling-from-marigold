<!doctype html><meta charset="utf-8"><title>Whip with weight G3d</title>
<style>body{font:16px system-ui;background:#181b20;color:#eee;margin:24px}select,button{font:inherit;padding:6px;margin-right:10px}canvas{width:48%;background:#000}</style>
<h1>Whip with weight (T3d): today left, revised right</h1>
<label>Pair <select id="pair"><option>lou-george</option><option>george-lou</option></select></label>
<label>Direction <select id="dir"><option>right</option><option>left</option></select></label>
<label>Part <select id="part"><option value="throw">Throw</option><option value="rope">Rope hit</option></select></label>
<label>Speed <select id="spd"><option value="1">Normal</option><option value="0.25">Quarter</option></select></label>
<p>Fresh receiver. Flag <code>?grapples=v1</code>.</p><canvas id="a"></canvas> <canvas id="b"></canvas>
<script>
const load=(w)=>{const d='frames/'+w+'/'+pair.value+'-'+dir.value+'-fresh/'+part.value+'/';return Array.from({length:120},(_,i)=>{const im=new Image();im.src=d+'s'+String(i).padStart(4,'0')+'.jpg';return im})};
let A,B,f=0,last=0;const ca=a.getContext('2d'),cb=b.getContext('2d');
function sel(){A=load('today');B=load('revised');f=0}
for(const e of [pair,dir,part])e.onchange=sel;sel();
function draw(c,cv,im){if(im.complete&&im.naturalWidth){cv.width=im.naturalWidth;cv.height=im.naturalHeight;c.drawImage(im,0,0);return true}return false}
function tick(t){if(t-last>1000/(60*+spd.value)){last=t;if(!draw(ca,a,A[f])&&f>0)f=-1;else draw(cb,b,B[f]);f++}requestAnimationFrame(tick)}requestAnimationFrame(tick);
</script>
