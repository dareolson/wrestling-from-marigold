<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WFM Rig Tuner</title>
  <link rel="icon" href="data:," />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #101014; color: #ccc;
      font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex; height: 100vh; overflow: hidden;
    }
    #stage { flex: 1 1 auto; display: flex; align-items: center; justify-content: center; background: #000; min-width: 0; }
    #stage canvas { max-width: 100%; max-height: 100%; }
    #panel {
      flex: 0 0 380px; overflow-y: auto; padding: 10px 12px 40px;
      background: #17171c; border-left: 1px solid #2a2a33;
    }
    h1 { font-size: 15px; color: #eee; margin-bottom: 8px; }
    details { margin-bottom: 6px; border: 1px solid #2a2a33; border-radius: 4px; background: #1c1c22; }
    details > summary {
      cursor: pointer; padding: 5px 8px; font-weight: 600; color: #ddd;
      user-select: none; list-style: none;
    }
    details > summary::before { content: "▸ "; color: #888; }
    details[open] > summary::before { content: "▾ "; }
    details > .body { padding: 4px 8px 8px; }
    .row { display: flex; align-items: center; gap: 6px; margin: 2px 0; }
    .row label { flex: 0 0 128px; color: #aaa; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .row input[type=range] { flex: 1 1 auto; min-width: 60px; }
    .row input[type=number] {
      flex: 0 0 64px; width: 64px; background: #101014; color: #eee;
      border: 1px solid #333; border-radius: 3px; padding: 2px 4px; font-size: 12px;
    }
    .row input[type=checkbox] { flex: 0 0 auto; }
    .row select {
      flex: 1 1 auto; background: #101014; color: #eee; border: 1px solid #333;
      border-radius: 3px; padding: 3px 4px;
    }
    .row .val { flex: 0 0 auto; color: #777; font-size: 11px; }
    button {
      background: #2c3f68; color: #eee; border: 1px solid #44599c; border-radius: 3px;
      padding: 3px 10px; cursor: pointer; font-size: 12px;
    }
    button:hover { background: #38508a; }
    button.small { padding: 1px 7px; font-size: 11px; }
    .btnrow { display: flex; gap: 6px; margin: 6px 0 2px; flex-wrap: wrap; }
    #exportOut {
      width: 100%; height: 190px; background: #0c0c10; color: #9fd08f;
      border: 1px solid #2a2a33; border-radius: 3px;
      font: 11px/1.35 "SF Mono", Menlo, monospace; padding: 6px; white-space: pre; overflow: auto;
    }
    .hint { color: #777; font-size: 11px; margin: 3px 0; }
    .legend span { display: inline-block; margin-right: 10px; font-size: 11px; }
    .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 3px; vertical-align: -1px; }
  </style>
</head>
<body>
  <div id="stage"></div>
  <div id="panel">
    <h1>Rig Tuner <span class="hint" style="font-weight:400">dev-only — game code untouched</span></h1>
    <div id="controls"></div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/phaser@4.1.0/dist/phaser.min.js"></script>
  <script type="module" src="./rig-tuner.js"></script>
</body>
</html>
