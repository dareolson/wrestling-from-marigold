<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Marigold — Trainer scene</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #08090b; color: #f6e4bd; font-family: Georgia, serif; }
    #scene { position: relative; width: min(100vw, 1200px, 160vh); aspect-ratio: 8/5; overflow: hidden; background: #16100c; }
    #world { position: absolute; inset: 0; transform-origin: 45% 45%; animation: dolly 12s ease-in-out forwards; }
    #room { position: absolute; width: 100%; height: 100%; object-fit: cover; }
    #trainer { position: absolute; height: 97%; width: auto; left: 6%; bottom: -4%; }
    #dialogue { position: absolute; inset: auto 0 0; min-height: 26%; padding: 5% 6% 3%; background: linear-gradient(transparent, rgba(7,8,11,.93) 32%); }
    #speaker { color: #d6ac63; font-size: clamp(12px, 1.6vw, 18px); letter-spacing: .14em; }
    #line { margin: 12px 0 18px; max-width: 820px; font-size: clamp(16px, 2.4vw, 28px); line-height: 1.35; }
    button { font: inherit; font-size: 14px; color: #f6e4bd; background: #21170f; border: 1px solid #9b7b4a; padding: 8px 14px; cursor: pointer; margin-right: 8px; }
    button:focus-visible { outline: 2px solid #fff2ce; outline-offset: 3px; }
    .corner #dialogue { inset: 3% auto auto 3%; width: 27%; min-height: 0; padding: 14px; background: rgba(7,8,11,.78); }
    .corner #speaker { color: #ddd; }
    .corner #line { color: #fff; font-size: clamp(14px, 1.8vw, 23px); }
    .corner button { color: #eee; background: #191919; border-color: #888; margin-bottom: 6px; }
    .aisle #dialogue { min-height: 0; padding: 12px; background: rgba(0,0,0,.65); }
    .aisle button { color: #eee; background: #191919; border-color: #888; }
    @keyframes dolly { from { transform: scale(1); } to { transform: scale(1.04); } }
    @media (prefers-reduced-motion: reduce) { #world { animation: none; } }
  </style>
</head>
<body>
  <main id="scene" aria-label="Trainer in the Marigold dressing room">
    <div id="world"><img id="room" alt="A worn 1950s dressing room with lockers and a warm ceiling light"><img id="trainer" alt="Guy's trainer holding athletic tape, with a towel over his shoulders"></div>
    <section id="dialogue" aria-live="polite"><div id="speaker">TRAINER</div><p id="line"></p><button id="next">Next · Enter</button><button id="replay">Replay camera</button></section>
  </main>
  <script type="module" src="./preview.js"></script>
</body>
</html>
