<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Wrestler Cutter</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px;
    background: #1b1b1f;
    color: #e8e6e3;
    font: 14px/1.4 -apple-system, "SF Pro Text", system-ui, sans-serif;
  }
  h1 { font-size: 18px; margin: 0 0 4px; }
  p.sub { color: #9a98a3; margin: 0 0 20px; }
  .slug-row {
    display: flex; align-items: center; gap: 8px; margin-bottom: 24px;
  }
  .slug-row input {
    background: #2a2a30; border: 1px solid #45454e; color: #e8e6e3;
    padding: 6px 8px; border-radius: 4px; font: 13px monospace; width: 220px;
  }
  .dest { color: #9a98a3; font-family: monospace; font-size: 12.5px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 16px;
  }
  .card {
    background: #232328; border: 1px solid #35353c; border-radius: 8px;
    padding: 14px;
  }
  .card h2 {
    font-size: 13px; margin: 0 0 2px; text-transform: uppercase;
    letter-spacing: 0.06em; color: #cfcdd6;
  }
  .card .filename { color: #6f6d78; font-family: monospace; font-size: 12px; margin-bottom: 10px; }
  .dropzone {
    height: 220px; border: 2px dashed #45454e; border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    position: relative; overflow: hidden; cursor: pointer;
    background-image:
      linear-gradient(45deg, #2c2c33 25%, transparent 25%),
      linear-gradient(-45deg, #2c2c33 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #2c2c33 75%),
      linear-gradient(-45deg, transparent 75%, #2c2c33 75%);
    background-size: 16px 16px;
    background-position: 0 0, 0 8px, 8px -8px, -8px 0px;
    background-color: #1f1f24;
  }
  .dropzone.drag { border-color: #7c9cff; }
  .dropzone .hint { color: #6f6d78; text-align: center; padding: 0 12px; pointer-events: none; }
  .dropzone canvas { display: block; }
  .dropzone .pivotline {
    position: absolute; left: 0; right: 0; height: 0;
    border-top: 2px dashed #ff5c5c; pointer-events: none;
  }
  .status { margin-top: 10px; font-size: 12.5px; min-height: 54px; }
  .status .ok { color: #6bd97a; }
  .status .warn { color: #ffb454; }
  .status .row { margin-bottom: 2px; }
  .actions { margin-top: 8px; display: flex; gap: 8px; }
  button {
    background: #3a3a42; color: #e8e6e3; border: 1px solid #4a4a54;
    border-radius: 4px; padding: 6px 12px; font-size: 12.5px; cursor: pointer;
  }
  button:disabled { opacity: 0.35; cursor: default; }
  button:not(:disabled):hover { background: #46464f; }
  input[type=file] { display: none; }
</style>
</head>
<body>

<h1>Wrestler Cutter</h1>
<p class="sub">Drop each hand-cut layer (rough crop, transparent PNG). It auto-crops to content, scales to the spec canvas, flushes the pivot edge, and checks padding / joint-seam rules from DRAWING_GUIDE.md.</p>

<div class="slug-row">
  <label for="slug">Character slug:</label>
  <input id="slug" type="text" placeholder="gorgeous_george" />
  <span class="dest" id="dest"></span>
</div>

<div class="grid" id="grid"></div>

<script>
const PARTS = [
  { key: "head",      label: "Head",       w: 200, h: 200, pivot: "bottom" },
  { key: "torso",     label: "Torso",      w: 190, h: 260, pivot: "top" },
  { key: "upper_arm", label: "Upper Arm",  w: 130, h: 160, pivot: "top" },
  { key: "forearm",   label: "Forearm",    w: 130, h: 190, pivot: "top", opaqueCap: true },
  { key: "thigh",     label: "Thigh",      w: 150, h: 150, pivot: "top" },
  { key: "shin",      label: "Shin",       w: 150, h: 230, pivot: "top", opaqueCap: true },
];

const ALPHA_THRESHOLD = 10;   // ignore near-transparent fringe when finding content bounds
const PAD_TARGET_MIN = 20;
const PAD_TARGET_MAX = 30;
const PREVIEW_SCALE = 1;      // canvas is drawn at native spec size; CSS scales the box

const slugInput = document.getElementById("slug");
const destEl = document.getElementById("dest");
function updateDest() {
  const slug = slugInput.value.trim() || "[character_slug]";
  destEl.textContent = `→ src/assets/wrestlers/${slug}/`;
}
slugInput.addEventListener("input", updateDest);
updateDest();

const grid = document.getElementById("grid");

PARTS.forEach(part => {
  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = `
    <h2>${part.label}</h2>
    <div class="filename">${part.key}.png &middot; target ${part.w}×${part.h}, pivot ${part.pivot}-center</div>
    <div class="dropzone" tabindex="0">
      <div class="hint">Drop PNG here<br>or click to choose</div>
      <input type="file" accept="image/png" />
    </div>
    <div class="status"></div>
    <div class="actions">
      <button class="download" disabled>Download ${part.key}.png</button>
    </div>
  `;
  grid.appendChild(card);

  const dropzone = card.querySelector(".dropzone");
  const fileInput = card.querySelector("input[type=file]");
  const statusEl = card.querySelector(".status");
  const downloadBtn = card.querySelector(".download");
  let resultBlob = null;

  dropzone.addEventListener("click", () => fileInput.click());
  dropzone.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") fileInput.click(); });

  ["dragenter", "dragover"].forEach(evt =>
    dropzone.addEventListener(evt, e => { e.preventDefault(); dropzone.classList.add("drag"); })
  );
  ["dragleave", "drop"].forEach(evt =>
    dropzone.addEventListener(evt, e => { e.preventDefault(); dropzone.classList.remove("drag"); })
  );
  dropzone.addEventListener("drop", e => {
    const file = e.dataTransfer.files[0];
    if (file) processFile(file);
  });
  fileInput.addEventListener("change", () => {
    if (fileInput.files[0]) processFile(fileInput.files[0]);
  });

  function processFile(file) {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(url);
      try {
        const { canvas, padInfo, capInfo } = buildAsset(img, part);
        renderPreview(canvas, padInfo);
        renderStatus(padInfo, capInfo);
        canvas.toBlob(blob => {
          resultBlob = blob;
          downloadBtn.disabled = false;
        }, "image/png");
      } catch (err) {
        statusEl.innerHTML = `<div class="row warn">Error: ${err.message}</div>`;
      }
    };
    img.onerror = () => {
      statusEl.innerHTML = `<div class="row warn">Could not load image.</div>`;
    };
    img.src = url;
  }

  function renderPreview(resultCanvas, padInfo) {
    dropzone.innerHTML = "";
    const wrap = document.createElement("div");
    wrap.style.position = "relative";
    wrap.style.width = part.w + "px";
    wrap.style.height = part.h + "px";
    wrap.style.margin = "auto";

    // scale the box to fit the 220px-tall dropzone while keeping native pixel canvas
    const fit = Math.min(240 / part.w, 200 / part.h, 1.4);
    wrap.style.transform = `scale(${fit})`;

    resultCanvas.style.display = "block";
    resultCanvas.style.width = part.w + "px";
    resultCanvas.style.height = part.h + "px";
    wrap.appendChild(resultCanvas);

    const pivotLine = document.createElement("div");
    pivotLine.className = "pivotline";
    pivotLine.style.top = (part.pivot === "top" ? 0 : part.h - 1) + "px";
    wrap.appendChild(pivotLine);

    dropzone.style.display = "flex";
    dropzone.appendChild(wrap);
  }

  function renderStatus(padInfo, capInfo) {
    const rows = [];
    const padOk = padInfo.min >= PAD_TARGET_MIN && padInfo.min <= PAD_TARGET_MAX + 15;
    const padWarnLow = padInfo.min < PAD_TARGET_MIN;
    if (padWarnLow) {
      rows.push(`<div class="row warn">Padding ${Math.round(padInfo.min)}px on non-pivot side — below the 20–30px target, content may clip on extreme rotation.</div>`);
    } else {
      rows.push(`<div class="row ok">Padding ~${Math.round(padInfo.min)}px on non-pivot sides.</div>`);
    }
    if (part.opaqueCap) {
      if (capInfo.ok) {
        rows.push(`<div class="row ok">Top edge fully opaque — covers joint seam.</div>`);
      } else {
        rows.push(`<div class="row warn">Top edge has ${capInfo.transparentPct}% transparent pixels — elbow/knee seam may show a gap. Flatten the top row in Procreate.</div>`);
      }
    }
    statusEl.innerHTML = rows.join("");
  }

  downloadBtn.addEventListener("click", () => {
    if (!resultBlob) return;
    const a = document.createElement("a");
    a.href = URL.createObjectURL(resultBlob);
    a.download = `${part.key}.png`;
    a.click();
  });
});

// Crop the source image to the bounding box of non-transparent pixels,
// scale it to fit the target canvas leaving margin on non-pivot sides,
// and flush it against the pivot edge.
function buildAsset(img, part) {
  const src = document.createElement("canvas");
  src.width = img.naturalWidth;
  src.height = img.naturalHeight;
  const sctx = src.getContext("2d");
  sctx.drawImage(img, 0, 0);
  const { data } = sctx.getImageData(0, 0, src.width, src.height);

  let minX = src.width, minY = src.height, maxX = -1, maxY = -1;
  for (let y = 0; y < src.height; y++) {
    for (let x = 0; x < src.width; x++) {
      const a = data[(y * src.width + x) * 4 + 3];
      if (a > ALPHA_THRESHOLD) {
        if (x < minX) minX = x;
        if (x > maxX) maxX = x;
        if (y < minY) minY = y;
        if (y > maxY) maxY = y;
      }
    }
  }
  if (maxX < 0) throw new Error("image is fully transparent");

  const contentW = maxX - minX + 1;
  const contentH = maxY - minY + 1;

  const padMid = (PAD_TARGET_MIN + PAD_TARGET_MAX) / 2;
  // top-pivot parts: flush at top, padding on left/right/bottom.
  // bottom-pivot (head): flush at bottom, padding on left/right/top.
  const availW = part.w - padMid * 2;
  const availH = part.h - padMid;
  const scale = Math.min(availW / contentW, availH / contentH);

  const drawW = contentW * scale;
  const drawH = contentH * scale;
  const drawX = (part.w - drawW) / 2;
  const drawY = part.pivot === "top" ? 0 : part.h - drawH;

  const out = document.createElement("canvas");
  out.width = part.w;
  out.height = part.h;
  const octx = out.getContext("2d");
  octx.imageSmoothingEnabled = true;
  octx.imageSmoothingQuality = "high";
  octx.drawImage(src, minX, minY, contentW, contentH, drawX, drawY, drawW, drawH);

  const leftPad = drawX;
  const rightPad = part.w - (drawX + drawW);
  const bottomPad = part.pivot === "top" ? part.h - (drawY + drawH) : 0;
  const topPad = part.pivot === "bottom" ? drawY : 0;
  const sidePads = [leftPad, rightPad, bottomPad, topPad].filter(p => p > 0.5);
  const padInfo = { min: Math.min(...sidePads) };

  let capInfo = { ok: true, transparentPct: 0 };
  if (part.opaqueCap) {
    const rowData = octx.getImageData(Math.round(drawX), 0, Math.max(1, Math.round(drawW)), 1).data;
    let transparent = 0;
    const total = rowData.length / 4;
    for (let i = 0; i < total; i++) {
      if (rowData[i * 4 + 3] < 250) transparent++;
    }
    const pct = Math.round((transparent / total) * 100);
    capInfo = { ok: pct < 3, transparentPct: pct };
  }

  return { canvas: out, padInfo, capInfo };
}
</script>
</body>
</html>
